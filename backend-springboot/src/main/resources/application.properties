spring.application.name=e-newsletter

emirhan-karakoc.url.backend=${BACKEND_URL:http://localhost:8080}
emirhan-karakoc.url.frontend=${FRONTEND_URL:http://localhost:5173}

# Security
spring.security.user.name=${SPRING_SECURITY_USER:user}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:local-dev-only}
security.jwt.secret-key=${JWT_SECRET:local-dev-change-me}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/newsletter?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# S3-compatible storage
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.endpoint=${R2_ENDPOINT:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:}
cloudflare.r2.public-url=${R2_PUBLIC_URL:}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:${emirhan-karakoc.url.backend}/connect/google/callback}
